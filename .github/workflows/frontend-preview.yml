name: Capture authentic static frontend preview
on:
  pull_request:
  workflow_dispatch:
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install screenshot browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Serve checked-in frontend assets
        run: |
          python -m http.server 8000 > frontend.log 2>&1 &
      - name: Capture real static page preview
        run: |
          mkdir -p artifacts
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={"width": 1440, "height": 900})
              page.goto("http://127.0.0.1:8000/static/index.html", wait_until="domcontentloaded", timeout=30000)
              page.screenshot(path="artifacts/frontend-static-preview.png", full_page=True)
              browser.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-static-frontend-preview
          path: |
            artifacts/frontend-static-preview.png
            frontend.log
